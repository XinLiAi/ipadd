name: Build EXE

# ---------------------------------------------------------------------------
# Builds a Windows EXE with PyInstaller.
#
#   legacy  -> Python 3.8 + PySide2 (Qt 5)  : Win7 SP1 / Server 2008 R2 and later
#   modern  -> Python 3.11 + PySide6 (Qt 6) : Win10 1809 / Server 2016 and later
#
# The Python version used to BUILD matters: python38.dll is bundled into the
# EXE and is the last one that runs on Windows 7. Python 3.9+ installers
# actively refuse to run on Win7 (PEP 11).
#
# Action versions below are deliberately the Node.js 24 line.
# The old v4 / v5 pairs run on Node 20, which GitHub deprecated:
# they now emit warnings and can fail with "git.exe exit code 128".
#   actions/checkout        v4 -> v5   (Node 24, needs runner >= 2.327.1)
#   actions/setup-python    v5 -> v6   (Node 24)
#   actions/upload-artifact v4 -> v5   (Node 24)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which build to produce
        required: true
        default: both
        type: choice
        options:
          - both
          - legacy
          - modern
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  legacy:
    name: Legacy EXE Qt5 Win7
    if: github.event.inputs.target != 'modern'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'

      - name: Show environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies PySide2 Qt5
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: PySide2 openpyxl python-docx
          python -m pip install --only-binary=:all: "pyinstaller<6"

      - name: Show Qt binding
        run: python qt_compat.py

      - name: Build
        run: python -m PyInstaller IPAddressTool.spec --clean --noconfirm

      - name: List output
        run: Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: IPAddressTool_PySide2_Win7
          path: dist/*.exe

  modern:
    name: Modern EXE Qt6 Win10
    if: github.event.inputs.target != 'legacy'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies PySide6 Qt6
        run: |
          python -m pip install --only-binary=:all: PySide6-Essentials openpyxl python-docx
          python -m pip install --only-binary=:all: pyinstaller

      - name: Show Qt binding
        run: python qt_compat.py

      - name: Build
        run: python -m PyInstaller IPAddressTool.spec --clean --noconfirm

      - name: List output
        run: Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: IPAddressTool_PySide6_Win10
          path: dist/*.exe
