name: Build EXE

on:
  workflow_dispatch:            # manual trigger from the Actions tab
    inputs:
      target:
        description: "Which build to produce"
        required: true
        default: "both"
        type: choice
        options: [both, legacy, modern]
  push:
    tags: ["v*"]                # also build on version tags

jobs:
  # ------------------------------------------------------------
  # Legacy: Python 3.8 + PySide2 (Qt 5)
  # Runs on Windows 7 SP1 / Server 2008 R2 and later.
  # NOTE: builds on a modern runner (Server 2022), so the result
  #       MUST be tested on the actual old machine before use.
  # ------------------------------------------------------------
  legacy:
    if: github.event.inputs.target != 'modern'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies (PySide2 / Qt 5)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: PySide2 openpyxl python-docx
          python -m pip install "pyinstaller<6"

      - name: Show binding
        run: python qt_compat.py

      - name: Build
        run: python -m PyInstaller IPAddressTool.spec --clean --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: IPAddressTool_PySide2_Win7
          path: dist/*.exe

  # ------------------------------------------------------------
  # Modern: Python 3.11 + PySide6 (Qt 6)
  # Windows 10 1809 / Server 2016 and later ONLY.
  # ------------------------------------------------------------
  modern:
    if: github.event.inputs.target != 'legacy'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (PySide6 / Qt 6)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: PySide6-Essentials openpyxl python-docx
          python -m pip install --only-binary=:all: pyinstaller

      - name: Show binding
        run: python qt_compat.py

      - name: Build
        run: python -m PyInstaller IPAddressTool.spec --clean --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: IPAddressTool_PySide6_Win10
          path: dist/*.exe
